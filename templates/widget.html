<div id="ml-fab-wrap">
  <button id="ml-fab" title="Media Library">
    <i class="fas fa-photo-video"></i>
  </button>

  <div id="ml-fab-popup" style="display:none;">

    <div id="ml-fab-header">
      <span>
        <i class="fas fa-photo-video mr-2"></i>Media
      </span>

      <div style="display:flex;align-items:center;gap:.4rem;">
        <input
          type="text"
          id="ml-fab-search"
          placeholder="Search..."
        >

        <a
          href="/plugins/media-library/"
          target="_blank"
          id="ml-fab-open-page"
          title="Open media library"
          style="color:#adb5bd;font-size:1rem;line-height:1;text-decoration:none;"
        >
          <i class="fas fa-external-link-alt"></i>
        </a>

        <button id="ml-fab-close" title="Close">
          &times;
        </button>
      </div>
    </div>

    <!-- Selected media information -->
    <div id="ml-fab-url-bar" style="display:none;">
      <div style="display:flex;flex-direction:column;gap:.45rem;width:100%;">

        <!-- Full URL -->
        <div class="ml-fab-format-row">
          <span class="ml-fab-format-badge ml-fab-format-badge-dark">
            Full
          </span>

          <code
            id="ml-fab-url-full"
            class="ml-fab-format-code"
            title="Click to copy"
          ></code>

          <button
            id="ml-fab-copy-full"
            class="ml-fab-copy-btn"
            title="Copy full URL"
          >
            <i class="fas fa-copy"></i> full
          </button>

          <span
            id="ml-fab-copy-full-ok"
            class="ml-fab-copy-ok"
            style="display:none;"
          >
            &#10003;
          </span>
        </div>

        <!-- Short URL -->
        <div class="ml-fab-format-row">
          <span class="ml-fab-format-badge">
            Short
          </span>

          <code
            id="ml-fab-url-short"
            class="ml-fab-format-code ml-fab-muted-code"
            title="Click to copy"
          ></code>

          <button
            id="ml-fab-copy-short"
            class="ml-fab-copy-btn"
            title="Copy short URL"
          >
            <i class="fas fa-copy"></i> short
          </button>

          <span
            id="ml-fab-copy-short-ok"
            class="ml-fab-copy-ok"
            style="display:none;"
          >
            &#10003;
          </span>
        </div>

        <!-- CTFd Markdown -->
        <div class="ml-fab-format-row">
          <span class="ml-fab-format-badge ml-fab-format-badge-primary">
            Markdown
          </span>

          <code
            id="ml-fab-markdown"
            class="ml-fab-format-code"
            title="Click to copy CTFd Markdown"
          ></code>

          <button
            id="ml-fab-copy-markdown"
            class="ml-fab-copy-btn"
            title="Copy CTFd Markdown"
          >
            <i class="fas fa-copy"></i> markdown
          </button>

          <span
            id="ml-fab-copy-markdown-ok"
            class="ml-fab-copy-ok"
            style="display:none;"
          >
            &#10003;
          </span>
        </div>

        <!-- Responsive HTML -->
        <div
          id="ml-fab-html-row"
          class="ml-fab-format-row"
          style="display:none;"
        >
          <span class="ml-fab-format-badge ml-fab-format-badge-info">
            HTML
          </span>

          <code
            id="ml-fab-html"
            class="ml-fab-format-code"
            title="Click to copy responsive HTML"
          ></code>

          <button
            id="ml-fab-copy-html"
            class="ml-fab-copy-btn"
            title="Copy responsive HTML"
          >
            <i class="fas fa-code"></i> html
          </button>

          <span
            id="ml-fab-copy-html-ok"
            class="ml-fab-copy-ok"
            style="display:none;"
          >
            &#10003;
          </span>
        </div>

      </div>
    </div>

    <div id="ml-fab-grid"></div>
  </div>
</div>


<style>
#ml-fab {
  position:fixed;
  bottom:22px;
  left:22px;
  z-index:9998;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#343a40;
  color:#fff;
  border:none;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.35);
  font-size:1.1rem;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .2s,transform .15s;
}

#ml-fab:hover {
  background:#007bff;
  transform:scale(1.08);
}

#ml-fab-wrap {
  position:fixed;
  bottom:22px;
  left:22px;
  z-index:9999;
}

#ml-fab-popup {
  position:fixed;
  bottom:80px;
  left:22px;
  width:420px;
  max-width:calc(100vw - 44px);
  max-height:600px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 8px 32px rgba(0,0,0,.22);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  z-index:9999;
}

#ml-fab-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.55rem .8rem;
  background:#343a40;
  color:#fff;
  font-size:.88rem;
  font-weight:600;
  gap:.5rem;
}

#ml-fab-search {
  background:#495057;
  border:1px solid #6c757d;
  color:#fff;
  border-radius:4px;
  padding:.2rem .5rem;
  font-size:.78rem;
  width:120px;
  outline:none;
}

#ml-fab-search::placeholder {
  color:#adb5bd;
}

#ml-fab-close {
  background:none;
  border:none;
  color:#adb5bd;
  font-size:1.3rem;
  cursor:pointer;
  line-height:1;
  padding:0 .15rem;
}

#ml-fab-close:hover {
  color:#fff;
}

#ml-fab-open-page:hover {
  color:#fff !important;
}

#ml-fab-url-bar {
  padding:.55rem .7rem;
  background:#f8f9fa;
  border-bottom:1px solid #e9ecef;
}

.ml-fab-format-row {
  display:flex;
  align-items:center;
  gap:.35rem;
  flex-wrap:wrap;
}

.ml-fab-format-badge {
  font-size:.65rem;
  background:#e9ecef;
  color:#495057;
  border-radius:3px;
  padding:.1rem .35rem;
  white-space:nowrap;
  min-width:58px;
  text-align:center;
}

.ml-fab-format-badge-dark {
  background:#6c757d;
  color:#fff;
}

.ml-fab-format-badge-primary {
  background:#007bff;
  color:#fff;
}

.ml-fab-format-badge-info {
  background:#17a2b8;
  color:#fff;
}

.ml-fab-format-code {
  flex:1;
  min-width:160px;
  word-break:break-all;
  font-size:.7rem;
  color:#343a40;
  cursor:pointer;
}

.ml-fab-muted-code {
  color:#6c757d;
}

.ml-fab-copy-btn {
  background:none;
  border:1px solid #ced4da;
  border-radius:4px;
  cursor:pointer;
  padding:.1rem .35rem;
  font-size:.7rem;
  color:#495057;
  white-space:nowrap;
}

.ml-fab-copy-btn:hover {
  background:#e9ecef;
}

.ml-fab-copy-ok {
  color:#28a745;
  font-size:.75rem;
}

#ml-fab-grid {
  overflow-y:auto;
  flex:1;
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-content:flex-start;
}

.ml-fab-card {
  cursor:pointer;
  flex:0 0 88px;
  width:88px;
  border:2px solid #e9ecef;
  border-radius:6px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.07);
  transition:border-color .15s,transform .12s;
}

.ml-fab-card:hover {
  border-color:#adb5bd;
  transform:translateY(-2px);
}

.ml-fab-card.selected {
  border-color:#007bff;
}

.ml-fab-card img {
  width:100%;
  height:66px;
  object-fit:cover;
  display:block;
}

.ml-fab-icon {
  height:66px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#f8f9fa 0%,#e9ecef 100%);
}

.ml-fab-name {
  font-size:.6rem;
  color:#495057;
  padding:.2rem .3rem;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  border-top:1px solid #e9ecef;
  background:#fafafa;
}

.ml-fab-loading {
  width:100%;
  text-align:center;
  padding:1.5rem;
  color:#6c757d;
}

@media(max-width:480px) {
  #ml-fab-popup {
    left:8px;
    right:8px;
    width:auto;
    max-width:none;
    max-height:75vh;
  }

  #ml-fab-wrap {
    bottom:16px;
    left:16px;
  }

  #ml-fab {
    bottom:16px;
    left:16px;
  }

  #ml-fab-search {
    width:80px;
  }

  .ml-fab-format-code {
    min-width:120px;
  }
}
</style>


<script>
(function(){

  var fab = document.getElementById('ml-fab');
  var popup = document.getElementById('ml-fab-popup');
  var grid = document.getElementById('ml-fab-grid');
  var searchInput = document.getElementById('ml-fab-search');
  var urlBar = document.getElementById('ml-fab-url-bar');

  var urlFullEl = document.getElementById('ml-fab-url-full');
  var urlShortEl = document.getElementById('ml-fab-url-short');
  var markdownEl = document.getElementById('ml-fab-markdown');
  var htmlRow = document.getElementById('ml-fab-html-row');
  var htmlEl = document.getElementById('ml-fab-html');

  var copyFullBtn = document.getElementById('ml-fab-copy-full');
  var copyShortBtn = document.getElementById('ml-fab-copy-short');
  var copyMarkdownBtn = document.getElementById('ml-fab-copy-markdown');
  var copyHtmlBtn = document.getElementById('ml-fab-copy-html');

  var copyFullOk = document.getElementById('ml-fab-copy-full-ok');
  var copyShortOk = document.getElementById('ml-fab-copy-short-ok');
  var copyMarkdownOk = document.getElementById('ml-fab-copy-markdown-ok');
  var copyHtmlOk = document.getElementById('ml-fab-copy-html-ok');

  var _all = [];
  var _loaded = false;


  function isImg(loc) {
    return /\.(png|jpe?g|gif|svg|webp|bmp)$/i.test(loc);
  }


  function iconCls(loc) {
    if (isImg(loc)) {
      return 'fas fa-image text-info';
    }

    if (/\.pdf$/i.test(loc)) {
      return 'fas fa-file-pdf text-danger';
    }

    if (/\.(zip|tar|gz|rar|7z)$/i.test(loc)) {
      return 'fas fa-file-archive text-warning';
    }

    return 'fas fa-file text-secondary';
  }


  function escapeHtmlAttribute(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }


  function escapeMarkdownLabel(value) {
    return String(value)
      .replace(/\\/g, '\\\\')
      .replace(/\[/g, '\\[')
      .replace(/\]/g, '\\]');
  }


  /*
   * Native-style CTFd Markdown:
   *
   * Image:
   * ![image.png](/files/.../image.png)
   *
   * Other file:
   * [document.pdf](/files/.../document.pdf)
   */
  function buildMarkdown(name, shortUrl, image) {
    var safeName = escapeMarkdownLabel(name);

    if (image) {
      return '![' + safeName + '](' + shortUrl + ')';
    }

    return '[' + safeName + '](' + shortUrl + ')';
  }


  /*
   * Responsive HTML version for challenge descriptions.
   * No fixed width/height: aspect ratio is preserved.
   */
  function buildResponsiveHtml(name, shortUrl) {
    return (
      '<img src="' +
      escapeHtmlAttribute(shortUrl) +
      '" alt="' +
      escapeHtmlAttribute(name) +
      '" style="display:block;max-width:100%;height:auto;margin:1rem auto;">'
    );
  }


  function setGridMsg(text, cls) {
    grid.textContent = '';

    var d = document.createElement('div');

    d.className =
      'ml-fab-loading' +
      (cls ? ' ' + cls : '');

    d.textContent = text;

    grid.appendChild(d);
  }


  function resetCopyIndicators() {
    copyFullOk.style.display = 'none';
    copyShortOk.style.display = 'none';
    copyMarkdownOk.style.display = 'none';
    copyHtmlOk.style.display = 'none';
  }


  function renderFabGrid() {
    var q = searchInput.value.toLowerCase().trim();

    var files = _all.filter(function(f) {
      return (
        !q ||
        f.location.toLowerCase().includes(q)
      );
    });

    grid.textContent = '';

    if (!files.length) {
      setGridMsg('No files.');
      return;
    }

    files.forEach(function(f) {
      var shortUrl = '/files/' + f.location;
      var fullUrl = window.location.origin + shortUrl;
      var name = f.location.split('/').pop();
      var image = isImg(f.location);

      var card = document.createElement('div');
      card.className = 'ml-fab-card';

      if (image) {
        var img = document.createElement('img');

        img.src = shortUrl;
        img.alt = name;

        card.appendChild(img);

      } else {
        var wrap = document.createElement('div');

        wrap.className = 'ml-fab-icon';

        var ic = document.createElement('i');

        ic.className = iconCls(f.location) + ' fa-2x';

        wrap.appendChild(ic);
        card.appendChild(wrap);
      }

      var nm = document.createElement('div');

      nm.className = 'ml-fab-name';
      nm.title = name;
      nm.textContent = name;

      card.appendChild(nm);


      card.addEventListener('click', function() {

        document
          .querySelectorAll('.ml-fab-card')
          .forEach(function(c) {
            c.classList.remove('selected');
          });

        card.classList.add('selected');

        urlFullEl.textContent = fullUrl;
        urlShortEl.textContent = shortUrl;

        markdownEl.textContent =
          buildMarkdown(
            name,
            shortUrl,
            image
          );

        if (image) {
          htmlEl.textContent =
            buildResponsiveHtml(
              name,
              shortUrl
            );

          htmlRow.style.display = '';

        } else {
          htmlEl.textContent = '';
          htmlRow.style.display = 'none';
        }

        urlBar.style.display = '';

        resetCopyIndicators();
      });

      grid.appendChild(card);
    });
  }


  function loadFabFiles() {
    grid.textContent = '';

    var spinner = document.createElement('div');
    spinner.className = 'ml-fab-loading';

    var ic = document.createElement('i');
    ic.className = 'fas fa-spinner fa-spin fa-lg';

    spinner.appendChild(ic);
    grid.appendChild(spinner);

    fetch(
      '/api/v1/files?type=page',
      {
        credentials:'same-origin'
      }
    )
      .then(function(r) {
        return r.json();
      })
      .then(function(d) {
        _all = d.data || [];
        _loaded = true;
        renderFabGrid();
      })
      .catch(function() {
        setGridMsg(
          'Loading error.',
          'text-danger'
        );
      });
  }


  /*
   * Toggle the widget by clicking the floating icon.
   *
   * Unlike the original plugin, clicking elsewhere
   * on the admin page DOES NOT close the widget.
   */
  fab.addEventListener('click', function(e) {
    e.stopPropagation();

    var open =
      popup.style.display !== 'none';

    popup.style.display =
      open ? 'none' : '';

    if (!open && !_loaded) {
      loadFabFiles();
    }
  });


  /*
   * Explicit close button.
   */
  document
    .getElementById('ml-fab-close')
    .addEventListener('click', function() {
      popup.style.display = 'none';
    });


  /*
   * Escape closes the widget.
   */
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'Escape' &&
      popup.style.display !== 'none'
    ) {
      popup.style.display = 'none';
    }
  });


  /*
   * IMPORTANT:
   *
   * There is intentionally NO global
   * "click outside to close" handler.
   *
   * This allows the Media widget to stay open
   * while clicking and typing in the challenge editor.
   */


  function copyText(text) {
    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {
      return navigator.clipboard.writeText(text);
    }

    var ta =
      document.createElement('textarea');

    ta.value = text;
    ta.style.cssText =
      'position:fixed;opacity:0';

    document.body.appendChild(ta);

    ta.select();

    document.execCommand('copy');

    document.body.removeChild(ta);

    return Promise.resolve();
  }


  function copyFlash(text, okEl) {
    copyText(text)
      .then(function() {
        okEl.style.display = '';

        setTimeout(function() {
          okEl.style.display = 'none';
        }, 2000);
      });
  }


  copyFullBtn.addEventListener('click', function() {
    copyFlash(
      urlFullEl.textContent,
      copyFullOk
    );
  });


  urlFullEl.addEventListener('click', function() {
    copyFlash(
      urlFullEl.textContent,
      copyFullOk
    );
  });


  copyShortBtn.addEventListener('click', function() {
    copyFlash(
      urlShortEl.textContent,
      copyShortOk
    );
  });


  urlShortEl.addEventListener('click', function() {
    copyFlash(
      urlShortEl.textContent,
      copyShortOk
    );
  });


  copyMarkdownBtn.addEventListener('click', function() {
    copyFlash(
      markdownEl.textContent,
      copyMarkdownOk
    );
  });


  markdownEl.addEventListener('click', function() {
    copyFlash(
      markdownEl.textContent,
      copyMarkdownOk
    );
  });


  copyHtmlBtn.addEventListener('click', function() {
    copyFlash(
      htmlEl.textContent,
      copyHtmlOk
    );
  });


  htmlEl.addEventListener('click', function() {
    copyFlash(
      htmlEl.textContent,
      copyHtmlOk
    );
  });


  searchInput.addEventListener('input', function() {
    if (_loaded) {
      renderFabGrid();
    }
  });

}());
</script>
